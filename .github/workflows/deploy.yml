name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deployment in progress: the next run waits for it to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check VITE_GREEN_API_URL
        env:
          VITE_GREEN_API_URL: ${{ vars.VITE_GREEN_API_URL }}
        run: |
          if [ -z "$VITE_GREEN_API_URL" ]; then
            echo "::error::Set the VITE_GREEN_API_URL repository variable (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_GREEN_API_URL: ${{ vars.VITE_GREEN_API_URL }}
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages serves 404.html for unknown paths, which makes SPA deep links work
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job gets permission to publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
